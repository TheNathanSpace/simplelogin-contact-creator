services:
  simplelogin_adapter:
    image: ghcr.io/TheNathanSpace/simplelogin-contact-creator:latest
    pull_policy: always
    container_name: simplelogin_adapter
    restart: unless-stopped
    ports:
      - "4189:4189"
    environment:
      TZ: Etc/UTC
      TRUSTED_PROXIES: ""
      COOKIE_SECURE: "1"
      SIMPLELOGIN_BASE_URL: https://app.simplelogin.io
    volumes:
      - ./simplelogin_adapter:/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4189/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
